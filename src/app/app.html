<div class="container">
  <h1>Current Weather</h1>

  <div class="buttons">
    @for (city of cities; track city.name) {
      <button
        type="button"
        [class.active]="city.name === selectedCity"
        (click)="loadCity(city)">
        {{ city.name }}
      </button>
    }
  </div>
  

  @if (weather$ | async; as weather) {
    <div class="card">
      <h2>{{ selectedCity }}</h2>
      <p>{{ weather.temperature }} °C</p>
      <p>{{ weather.text }}</p>
      <div class="icon">{{ weather.icon }}</div>
    </div>
  }
</div>
